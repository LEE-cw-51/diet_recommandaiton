# 실험 1: 2목적 — NSGA-II (민감도 분석: 중간 균형 시나리오)
# 탄 57% / 단 15% / 지 28%  → 합산 100%

experiment_id: exp1_nsga2_mid_balanced

problem:
  class: Exp1Problem
  n_obj: 2
  nutrition_profile:
    label: mid_balanced
    r_C: 0.570
    r_P: 0.150
    r_F: 0.280
    w_C: 0.3333
    w_P: 0.3333
    w_F: 0.3334

algorithm:
  name: NSGA2
  pop_size: 200
  n_gen: 200
  crossover: { n_points: 2, prob: 0.9 }
  mutation:  { prob: 0.1, eta: 20 }
  eliminate_duplicates: true

runner:
  n_runs: 30
  seed_start: 42
