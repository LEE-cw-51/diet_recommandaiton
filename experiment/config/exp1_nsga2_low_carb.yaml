# 실험 1: 2목적 — NSGA-II (민감도 분석: 탄수화물 하한 시나리오)
# 탄 50% / 단 20% / 지 30%

experiment_id: exp1_nsga2_low_carb

problem:
  class: Exp1Problem
  n_obj: 2
  nutrition_profile:
    label: low_carb
    r_C: 0.500
    r_P: 0.200
    r_F: 0.300
    w_C: 0.3333
    w_P: 0.3333
    w_F: 0.3334

algorithm:
  name: NSGA2
  pop_size: 200
  n_gen: 200
  crossover: { n_points: 2, prob: 0.9 }
  mutation:  { prob: 0.1, eta: 20 }
  eliminate_duplicates: true

runner:
  n_runs: 30
  seed_start: 42
